<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AP Psychology Interactive Demos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared/theme.css">
<style>
  /* Home-page-only styles */
  .demo-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px;
               grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); }
  .demo-list a { display: block; height: 100%; text-decoration: none; color: var(--text);
                 transition: border-color .15s; }
  .demo-list a:hover { border-color: var(--btn); }
  .demo-list h3 { margin-bottom: 4px; }
  .demo-list p { margin: 0 0 8px; }
  .topic { display: inline-block; background: var(--bg-alt); border: 1px solid var(--border);
           border-radius: 8px; padding: 0 8px; font-size: .85rem; font-weight: 700; color: var(--heading); }
</style>
</head>
<body>
<main>
  <h1>AP Psychology Interactive Demos</h1>
  <p class="hint">Hands-on games and demos for concepts in the AP Psychology course. Choose a demo to open it.</p>

  <!--
    To add a demo: copy one <li>…</li> block, change the link (folder name + "/"),
    title, description, and topic. To add a unit, copy an <h2> + <ul> pair.
  -->

  <h2>Unit 2: Cognition</h2>
  <ul class="demo-list">
    <li>
      <a class="card" href="memory-span/">
        <h3>Memory Span Test</h3>
        <p>Repeat a growing sequence of colors and tones to find the limit of your short-term memory.</p>
        <span class="topic">2.4.A · 2.5.A</span>
      </a>
    </li>
  </ul>
</main>
</body>
</html>
